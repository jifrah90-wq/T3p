[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hltrader"
version = "0.1.0"
description = "Systematic trading system for Hyperliquid"
requires-python = ">=3.10"
dependencies = [
    "hyperliquid-python-sdk>=0.24.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
hltrader = "hltrader.cli:main"

[tool.setuptools.packages.find]
include = ["hltrader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
